name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle build variant"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "capacitor.config.*"
      - "client/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  build:
    name: Build Android ${{ github.event.inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Build selected APK
        working-directory: android
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: ./gradlew "assemble${BUILD_TYPE^}" --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: souq-jiran-${{ github.event.inputs.build_type || 'debug' }}-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
